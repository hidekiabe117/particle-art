<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粒子アート</title>
<style>
  html, body { margin: 0; background: #14151a; }
  html { scroll-behavior: auto; }
  #spacer { height: 500vh; }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  .cap { position: fixed; left: 0; right: 0; top: 10vh; text-align: center; color: #eee; font-family: sans-serif;
         pointer-events: none; opacity: 0; transform: translateY(20px); will-change: opacity, transform; }
  .cap h1 { margin: 0; font-size: clamp(24px, 5vw, 48px); letter-spacing: .1em; font-weight: 600; }
  .cap p { margin: 8px 0 0; font-size: 14px; color: #aab; }
  #bar { position: fixed; left: 0; top: 0; height: 3px; width: 100%; background: linear-gradient(90deg,#E91E63,#7F77DD,#D85A30);
         transform-origin: left; transform: scaleX(0); }
  #hint { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; color: #889; font: 12px sans-serif;
          pointer-events: none; transition: opacity .4s; }
  .ui { position: fixed; z-index: 2; left: 12px; bottom: 12px; display: flex; gap: 8px; font-family: sans-serif; }
  button { padding: 8px 14px; border: 1px solid #555; background: #22242c; color: #eee; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="spacer"></div>
<canvas id="c"></canvas>
<div id="bar"></div>
<div class="cap"><h1>うずまき</h1><p>スクロールして形を変えよう</p></div>
<div class="cap"><h1>リング</h1><p>粒子がひとつの輪になる</p></div>
<div class="cap"><h1>ハート</h1><p>粒子がハートの形に集まる</p></div>
<div class="cap"><h1>なみ</h1><p>上にスクロールすると戻ります</p></div>
<div id="hint">▼ SCROLL</div>
<div class="ui">
  <button id="mode">モード：はじく</button>
  <button id="burst">ばらまく</button>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const cols = ['#E91E63', '#7F77DD', '#D85A30'];
let W, H, ps = [], mx = -999, my = -999, repel = true, t = 0;
let sc = 0; // smoothed scroll position (0..3)
const caps = document.querySelectorAll('.cap');
const bar = document.getElementById('bar');
const hint = document.getElementById('hint');
const SPIN = [1, 1, 0, 0]; // rotation weight per shape
function ease(x) { return x * x * (3 - 2 * x); }

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = W * dpr;
  cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function build(n) {
  const size = Math.min(W, H) * 0.42;
  ps = [];
  for (let i = 0; i < n; i++) {
    const u = i / n, th = u * 6.2832;
    const k = 0.55 + 0.45 * ((i * 0.618) % 1);
    const hs = Math.sin(th);
    const sh = [
      [Math.cos(i * 2.39996) * Math.sqrt(u) * size, Math.sin(i * 2.39996) * Math.sqrt(u) * size],
      [Math.cos(th) * size * (0.85 + 0.12 * Math.sin(i * 7)), Math.sin(th) * size * (0.85 + 0.12 * Math.sin(i * 7))],
      [16 * hs * hs * hs * k * size / 17,
       -(13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th)) * k * size / 17 - size * 0.05],
      [(u - 0.5) * size * 3.2, Math.sin(u * 18 + i * 0.01) * size * 0.28 + (((i * 0.37) % 1) - 0.5) * size * 0.25]
    ];
    ps.push({
      sh: sh,
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0,
      vy: 0,
      c: cols[i % 3],
      s: 1.4 + Math.random() * 1.4
    });
  }
}

function pos(e) {
  const p = e.touches ? e.touches[0] : e;
  mx = p.clientX;
  my = p.clientY;
}

cv.addEventListener('mousemove', pos);
cv.addEventListener('touchmove', pos, { passive: true });
cv.addEventListener('touchstart', pos, { passive: true });
cv.addEventListener('mouseleave', function () { mx = -999; my = -999; });
cv.addEventListener('touchend', function () { mx = -999; my = -999; });

document.getElementById('mode').onclick = function () {
  repel = !repel;
  this.textContent = 'モード：' + (repel ? 'はじく' : '引き寄せる');
};

document.getElementById('burst').onclick = function () {
  ps.forEach(function (p) {
    const a = Math.random() * 6.2832;
    const f = 6 + Math.random() * 10;
    p.vx += Math.cos(a) * f;
    p.vy += Math.sin(a) * f;
  });
};

window.addEventListener('resize', function () { resize(); build(900); });

function loop() {
  t += 0.004;
  ctx.clearRect(0, 0, W, H);
  const maxS = document.documentElement.scrollHeight - H;
  const prog = maxS > 0 ? Math.min(1, Math.max(0, window.scrollY / maxS)) : 0;
  sc += (prog * 3 - sc) * 0.07;
  const i0 = Math.min(3, Math.floor(sc)), i1 = Math.min(3, i0 + 1);
  const f = ease(sc - i0);
  const spin = SPIN[i0] * (1 - f) + SPIN[i1] * f;
  const cs = Math.cos(t * spin), sn = Math.sin(t * spin);
  bar.style.transform = 'scaleX(' + prog + ')';
  hint.style.opacity = prog < 0.02 ? 1 : 0;
  caps.forEach(function (el, j) {
    const o = Math.max(0, 1 - Math.abs(sc - j) * 1.6);
    el.style.opacity = o;
    el.style.transform = 'translateY(' + ((1 - o) * 20 * (sc < j ? 1 : -1)) + 'px)';
  });
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    const bx = p.sh[i0][0] * (1 - f) + p.sh[i1][0] * f;
    const by = p.sh[i0][1] * (1 - f) + p.sh[i1][1] * f;
    const hx = W / 2 + bx * cs - by * sn;
    const hy = H / 2 + bx * sn + by * cs;
    p.vx += (hx - p.x) * 0.02;
    p.vy += (hy - p.y) * 0.02;
    const dx = p.x - mx, dy = p.y - my;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 120 && d > 0.1) {
      const f = (1 - d / 120) * (repel ? 3.2 : -1.6);
      p.vx += dx / d * f;
      p.vy += dy / d * f;
    }
    p.vx *= 0.88;
    p.vy *= 0.88;
    p.x += p.vx;
    p.y += p.vy;
    ctx.fillStyle = p.c;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.s, 0, 6.2832);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}

resize();
build(900);
loop();
</script>
</body>
</html>
